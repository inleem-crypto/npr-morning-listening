name: Prepare daily dictation lesson
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - lesson-status.js
      - scripts/generate_lesson.py
      - tests/**
      - requirements.txt
      - .github/workflows/daily-lesson.yml
  schedule:
    # UTC 20:15 and 20:25 = Korea 05:15 and 05:25 the following day.
    - cron: '15,25 20 * * *'
permissions:
  contents: write
concurrency:
  group: daily-dictation
  cancel-in-progress: false
jobs:
  create-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-medium-en-v2
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_lesson_status.js
      - name: Generate lesson
        id: generate
        run: python scripts/generate_lesson.py
      - name: Save transcription diagnostics
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: transcription-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: generation-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit lesson
        if: always() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure')
        run: |
          git add lesson.json
          if [ -f generation-status.json ]; then git add generation-status.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily dictation lesson"
          git push
